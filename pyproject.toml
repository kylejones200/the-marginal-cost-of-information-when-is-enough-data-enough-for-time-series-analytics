[project]
name = "the-marginal-cost-of-information-when-is-enough-data-enough-for-time-series-anal"
version = "0.1.0"
description = "Companion code for Medium article: the marginal cost of information when is enough data enough for time series analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.3.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
